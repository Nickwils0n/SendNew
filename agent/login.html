<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SendNew Agent</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1c1c1e;
    color: #f2f2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  form { width: 260px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 15px; text-align: center; margin-bottom: 4px; }
  input {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #3a3a3c;
    background: #2c2c2e;
    color: #f2f2f7;
    font-size: 13px;
  }
  button {
    padding: 8px;
    border-radius: 6px;
    border: none;
    background: #0a84ff;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #error { color: #ff453a; font-size: 12px; min-height: 14px; text-align: center; }
</style>
</head>
<body>
  <form id="loginForm">
    <h1>Connect this Mac to SendNew</h1>
    <input id="username" placeholder="Device username" autocomplete="username" />
    <input id="password" type="password" placeholder="Device password" autocomplete="current-password" />
    <div id="error"></div>
    <button id="submit" type="submit">Connect</button>
  </form>
  <script>
    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submit");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Connecting...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const result = await window.sendnew.login(username, password);
      if (result.error) {
        errorEl.textContent = result.error;
        submitBtn.disabled = false;
        submitBtn.textContent = "Connect";
      }
      // On success the main process closes this window and starts the agent.
    });
  </script>
</body>
</html>
