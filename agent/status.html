<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SendNew Agent — Status</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1c1c1e;
    color: #f2f2f7;
    margin: 0;
    padding: 20px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 12px; color: #a1a1a6; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2c2c2e;
    gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #a1a1a6; }
  .value { text-align: right; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot.ok { background: #30d158; }
  .dot.bad { background: #ff453a; }
  .dot.unknown { background: #ffd60a; }
  button {
    padding: 5px 10px;
    border-radius: 6px;
    border: none;
    background: #0a84ff;
    color: white;
    font-size: 12px;
    cursor: pointer;
  }
  #error {
    margin-top: 10px;
    padding: 10px;
    background: #3a1a1a;
    border-radius: 6px;
    color: #ff8a80;
    font-size: 12px;
    display: none;
  }
  .server-url {
    font-size: 11px;
    color: #6e6e73;
    word-break: break-all;
    margin-top: 10px;
  }
  #traffic {
    flex: 1;
    overflow-y: auto;
    background: #141416;
    border-radius: 8px;
    padding: 6px 10px;
  }
  .entry {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #232326;
    font-size: 12px;
  }
  .entry:last-child { border-bottom: none; }
  .arrow { width: 14px; text-align: center; flex-shrink: 0; }
  .arrow.in { color: #30d158; }
  .arrow.out.sent { color: #0a84ff; }
  .arrow.out.failed { color: #ff453a; }
  .entry-body { flex: 1; min-width: 0; }
  .entry-contact { color: #f2f2f7; font-weight: 500; }
  .entry-text { color: #a1a1a6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-time { color: #6e6e73; font-size: 10px; flex-shrink: 0; }
  #empty { color: #6e6e73; text-align: center; padding: 20px 0; font-size: 12px; }
</style>
</head>
<body>
  <h1>SendNew Agent</h1>

  <div class="row">
    <span class="label">Connection</span>
    <span class="value"><span class="dot unknown" id="connDot"></span><span id="connText">Checking…</span></span>
  </div>
  <div class="row">
    <span class="label">Device</span>
    <span class="value" id="deviceText">—</span>
  </div>
  <div class="row">
    <span class="label">Full Disk Access</span>
    <span class="value">
      <span class="dot unknown" id="fdaDot"></span><span id="fdaText">Checking…</span>
    </span>
  </div>
  <div class="row" id="fdaRow" style="display:none">
    <span class="label" style="font-size:11px">Needed to read incoming messages</span>
    <button id="fdaBtn">Open Settings</button>
  </div>

  <div id="error"></div>

  <h2>Traffic</h2>
  <div id="traffic">
    <div id="empty">No messages yet</div>
  </div>

  <div class="server-url" id="serverUrl"></div>

  <script>
    const connDot = document.getElementById("connDot");
    const connText = document.getElementById("connText");
    const deviceText = document.getElementById("deviceText");
    const fdaDot = document.getElementById("fdaDot");
    const fdaText = document.getElementById("fdaText");
    const fdaRow = document.getElementById("fdaRow");
    const errorEl = document.getElementById("error");
    const serverUrlEl = document.getElementById("serverUrl");
    const trafficEl = document.getElementById("traffic");
    const emptyEl = document.getElementById("empty");

    const KIND_LABEL = {
      imessage: "iMessage",
      facetime_audio: "FaceTime Audio",
      facetime_video: "FaceTime Video",
    };

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function entryNode(entry) {
      const el = document.createElement("div");
      el.className = "entry";

      const arrow = document.createElement("span");
      arrow.className = "arrow " + entry.direction + " " + (entry.status || "");
      arrow.textContent = entry.direction === "in" ? "↓" : entry.status === "failed" ? "✕" : "↑";

      const body = document.createElement("div");
      body.className = "entry-body";
      const contact = document.createElement("div");
      contact.className = "entry-contact";
      contact.textContent = `${entry.contact || "unknown"} · ${KIND_LABEL[entry.kind] || entry.kind}`;
      const text = document.createElement("div");
      text.className = "entry-text";
      text.textContent = entry.error ? `Failed: ${entry.error}` : (entry.body || "(no text)");
      body.appendChild(contact);
      body.appendChild(text);

      const time = document.createElement("div");
      time.className = "entry-time";
      time.textContent = formatTime(entry.timestamp);

      el.appendChild(arrow);
      el.appendChild(body);
      el.appendChild(time);
      return el;
    }

    function renderTraffic(entries) {
      trafficEl.innerHTML = "";
      if (!entries.length) {
        trafficEl.appendChild(emptyEl);
        return;
      }
      for (const entry of entries) trafficEl.appendChild(entryNode(entry));
    }

    function prependTraffic(entry) {
      if (trafficEl.contains(emptyEl)) trafficEl.innerHTML = "";
      trafficEl.insertBefore(entryNode(entry), trafficEl.firstChild);
      while (trafficEl.children.length > 100) trafficEl.removeChild(trafficEl.lastChild);
    }

    function render(status) {
      connDot.className = "dot " + (status.connected ? "ok" : "bad");
      connText.textContent = status.connected ? "Connected" : "Disconnected — retrying…";

      deviceText.textContent = status.device
        ? (status.device.label || status.device.username)
        : "Not signed in";

      const hasFda = status.permissions?.fullDiskAccess;
      fdaDot.className = "dot " + (hasFda ? "ok" : "bad");
      fdaText.textContent = hasFda ? "Granted" : "Not granted";
      fdaRow.style.display = hasFda ? "none" : "flex";

      if (status.lastError) {
        errorEl.textContent = status.lastError;
        errorEl.style.display = "block";
      } else {
        errorEl.style.display = "none";
      }

      serverUrlEl.textContent = "Server: " + status.serverUrl;

      if (status.traffic) renderTraffic(status.traffic);
    }

    window.sendnew.getStatus().then(render);
    window.sendnew.onStatusUpdate(render);
    window.sendnew.onTraffic(prependTraffic);

    document.getElementById("fdaBtn").addEventListener("click", () => {
      window.sendnew.openFullDiskAccessSettings();
    });

    // Full Disk Access requires an app restart to take effect after granting —
    // re-check periodically so the dot updates without the user hunting for it.
    setInterval(() => window.sendnew.getStatus().then(render), 5000);
  </script>
</body>
</html>
